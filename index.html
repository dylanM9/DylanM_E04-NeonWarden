<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neon Warden</title>
  </head>
  <body>
    <main class="cabinet" id="cabinet" data-mode="title">
      <aside class="panel panel-left" id="panel panel-left"
        aria-label="Ship status">
        <section class="readout" id="readout">
          <h2>Score</h2>
          <output id="score">0000000</output>
        </section>

        <section>
          <h2>Best</h2>
          <output id="best">0000000</output>
        </section>

        <section class="readout">
          <h2>Hull</h2>
          <div class="pips" id="lives">
            <span class="pip lit"
              style="width: 22px; clip-path: polygon(50% 0, 100% 100%, 0 100%); background: currentColor;"></span>
            <span class="pip lit"
              style="width: 22px; clip-path: polygon(50% 0, 100% 100%, 0 100%); background: currentColor;"></span>
            <span class="pip lit"
              style="width: 22px; clip-path: polygon(50% 0, 100% 100%, 0 100%); background: currentColor;"></span>
          </div>
        </section>

        <section class="readout">
          <h2>Cannon</h2>
          <div class="cells" id="power">
            <span class="cell lit" style="flex: 1; border-radius: 2px;"></span>
            <span class="cell lit" style="flex: 1; border-radius: 2px;"></span>
            <span class="cell lit" style="flex: 1; border-radius: 2px;"></span>
          </div>
        </section>

        <p class="badge">Self-play</p>
      </aside>

      <div class="screen">
        <div id="game"></div>

        <div class="banner" id="banner">
          <strong></strong>
          <span></span>
        </div>

        <p class="caption" id="caption"></p>
      </div>

      <aside class="panel panel-right" aria-label="Route">
        <h2>Route</h2>

        <ol class="route" id="route"></ol>

        <section class="boss" id="boss" hidden="true">
          <h2>Warden</h2>
          <div class="boss-meter">
            <span id="boss-fill"></span>
          </div>
        </section>
      </aside>
    </main>

    <p
      class="help">Arrows or WASD to fly · Space or Z to fire · Wait at the title for self-play</p>

    <template id="stopTemplate">
      <li class="stop" data-state="ahead">
        <span class="stop-dot"
          style="width: 12px; height: 12px; border: 2px solid currentColor; border-radius: 50%;"></span>
        <span class="stop-name">lorem ipsum</span>
      </li>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
